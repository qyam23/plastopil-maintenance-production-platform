<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>{% block title %}PLASTOPIL{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="theme-color" content="#10283e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/pwa.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/media.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dynamic-theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/identity.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/management.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/push.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/scanner.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/send-progress.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/report-form.css') }}">
</head>
<body>
  <main class="app-shell">
    <div class="notice" style="background:#fff0cc;color:#654400">גרסת ניסיון בלבד · אין להזין פרטים אמיתיים. דיווחים אינם מגיעים למפעל.</div>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}
      <div class="notice {{ category }}">{{ message }}</div>
    {% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/send-progress.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/pwa.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
