<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><title>QR · {{ record.name }}</title><style>@page{size:A4;margin:2cm}body{font-family:Arial,sans-serif;color:#10263d;margin:0}.label{width:16cm;min-height:8cm;border:1px dashed #7b8d98;padding:1cm;display:flex;gap:1.2cm;align-items:center}.qr{width:5cm;height:5cm;image-rendering:pixelated}.info{flex:1}h1{margin:0 0 .4cm;font-size:25pt}p{font-size:14pt;line-height:1.4}code{font-size:11pt}.print{margin-top:1cm;padding:.4cm .8cm;font-size:14pt}@media print{.print{display:none}.label{border:0}}</style></head><body><section class="label"><img class="qr" src="{{ url_for('qrcode_image', qr_id=record.id, _external=True) }}" alt="QR"><div class="info"><h1>{{ record.name }}</h1><p><strong>קוד מיקום:</strong> <code>{{ record.location_code }}</code></p>{% if record.description %}<p>{{ record.description }}</p>{% endif %}<p>סרקו לפתיחת דיווח למיקום זה.</p></div></section><button class="print" onclick="window.print()">הדפסה</button></body></html>
